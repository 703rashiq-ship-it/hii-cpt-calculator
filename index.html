
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HII CPT Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 1. Base & Background Color */
            --base-bg: #ebf0f5;         
            
            /* 2. Accent Color */
            --accent-peach: #ffb48a;    
            
            /* 3. Typography & Iconography */
            --text-main: #4b5e78;       
            --text-muted: #7c8ba1;      
            
            /* 4. Shadow Colors */
            --shadow-light: #ffffff;    
            --shadow-dark: #c3cce0;     
        }

        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: var(--base-bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 40px 20px; 
        }
        
        .app-wrapper { 
            display: flex; 
            gap: 30px; 
            max-width: 1400px; 
            margin: 0 auto; 
            align-items: flex-start; 
        }
        
        .input-panel { flex: 2; } 
        .summary-panel { flex: 1.3; position: sticky; top: 40px; }
        
        .input-panel, .summary-panel { 
            background-color: var(--base-bg); 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 
                10px 10px 20px var(--shadow-dark), 
                -10px -10px 20px var(--shadow-light);
        }
        
        h2 { 
            font-size: 24px;
            margin-top: 0; 
            color: var(--text-main); 
            letter-spacing: 0.5px;
            border-bottom: 2px solid rgba(195, 204, 224, 0.4);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        /* Container to align the Summary Header and the Rationale Button */
        .summary-header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(195, 204, 224, 0.4);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .summary-header-container h3 {
            font-size: 24px;
            margin: 0;
            padding: 0;
            border: none;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }
        
        .global-settings { 
            padding: 10px 0 20px 0; 
            margin-bottom: 30px; 
            display: flex; 
            align-items: center; 
            gap: 20px; 
            flex-wrap: wrap;
        }
        
        .global-settings label { 
            font-weight: 700; 
            color: var(--text-muted); 
            font-size: 15px; 
        }
        
        .button-group { 
            margin-top: 30px; 
            display: flex; 
            gap: 15px; 
            justify-content: flex-start;
        }
        
        .add-btn, .clear-btn { 
            background-color: var(--base-bg); 
            color: var(--text-main); 
            border: none; 
            border-radius: 14px; 
            padding: 14px 28px; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            transition: all 0.2s ease-in-out;
            box-shadow: 
                6px 6px 12px var(--shadow-dark), 
                -6px -6px 12px var(--shadow-light);
        }
        
        .add-btn { color: var(--accent-peach); }

        .add-btn:active, .clear-btn:active { 
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark),
                inset -4px -4px 8px var(--shadow-light);
        }

        /* Smaller button docked next to the Summary Header */
        .info-btn {
            background-color: var(--base-bg);
            color: var(--text-muted);
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 
                4px 4px 8px var(--shadow-dark), 
                -4px -4px 8px var(--shadow-light);
            transition: all 0.2s;
        }

        .info-btn:active {
            box-shadow: 
                inset 3px 3px 6px var(--shadow-dark), 
                inset -3px -3px 6px var(--shadow-light);
            color: var(--accent-peach);
        }
        
        .treatment-row { 
            display: flex; 
            gap: 15px; 
            background: transparent; 
            padding: 15px 0; 
            margin-bottom: 15px; 
            align-items: flex-end;
            border-bottom: 1px solid rgba(195, 204, 224, 0.4);
        }
        
        select, input { 
            padding: 12px 15px; 
            border: none; 
            border-radius: 12px;
            background-color: var(--base-bg); 
            color: var(--text-main); 
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            font-weight: 600;
            box-sizing: border-box; 
            box-shadow: 
                inset 4px 4px 8px var(--shadow-dark), 
                inset -4px -4px 8px var(--shadow-light);
            transition: all 0.2s ease-in-out;
        } 

        select:focus, input:focus { 
            outline: none; 
            box-shadow: 
                inset 6px 6px 12px var(--shadow-dark), 
                inset -6px -6px 12px var(--shadow-light);
        }
        
        input::placeholder { color: var(--text-muted); font-weight: 400; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.6; cursor: pointer; }
        
        .drug-box { flex: 1; min-width: 120px; display: flex; flex-direction: column; }
        .drug-box label, .time-col label { 
            font-size: 13px; 
            margin-bottom: 8px; 
            color: var(--text-muted); 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .drug-name { width: 100%; }

        .time-group { display: flex; gap: 12px; }
        .time-col { display: flex; flex-direction: column; }
        .time-col input { width: 85px; text-align: center; }
        
        .remove-btn { 
            background-color: var(--base-bg); 
            color: var(--text-muted); 
            border: none; 
            border-radius: 12px;
            cursor: pointer; 
            font-weight: bold; 
            height: 46px;
            width: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2px;
            box-shadow: 
                4px 4px 8px var(--shadow-dark), 
                -4px -4px 8px var(--shadow-light);
            transition: all 0.2s;
        }
        
        .remove-btn:active { 
            box-shadow: 
                inset 3px 3px 6px var(--shadow-dark), 
                inset -3px -3px 6px var(--shadow-light);
            color: var(--accent-peach);
        }
        
        /* --- FLOATING RATIONALE MODAL --- */
        .floating-modal {
            display: none;
            position: fixed;
            top: 100px;
            left: 100px;
            width: 400px;
            background-color: var(--base-bg);
            border-radius: 20px;
            box-shadow: 
                15px 15px 30px rgba(195, 204, 224, 0.8), 
                -15px -15px 30px var(--shadow-light);
            z-index: 1000;
            border: 1px solid var(--shadow-light);
        }

        .modal-header {
            padding: 20px 25px;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(195, 204, 224, 0.4);
            user-select: none;
        }
        .modal-header:active { cursor: grabbing; }
        
        .modal-header h3 { margin: 0; padding: 0; border: none; font-size: 20px; }
        
        .close-modal-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        .close-modal-btn:hover { color: var(--accent-peach); }

        .modal-body {
            padding: 25px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .result-line { 
            margin-bottom: 20px; 
            font-size: 16px; 
            font-weight: 700;
            color: var(--text-muted);
        }
        
        .highlight { 
            font-size: 15px; 
            color: var(--text-main); 
            display: block; 
            margin-top: 10px; 
            font-weight: 600;
            line-height: 1.4;
        }
        
        /* CPT SUMMARY STYLES */
        .tally-list { 
            font-size: 15px; 
            color: var(--text-main); 
            list-style: none; 
            padding: 0; 
            margin: 10px 0;
        }

        .tally-list .dos-group-header {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
            padding: 15px 5px 8px 5px;
            margin-top: 15px;
            border-bottom: 2px solid var(--shadow-dark); 
            display: block;
        }

        .tally-list .dos-group-header:first-child {
            margin-top: 0;
            padding-top: 0;
        }
        
        .tally-list .cpt-item { 
            margin-top: 12px; 
            padding: 14px 18px; 
            background: var(--base-bg);
            border-radius: 12px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-weight: 700;
            box-shadow: 
                5px 5px 10px var(--shadow-dark), 
                -5px -5px 10px var(--shadow-light);
        }

        .cpt-val { color: var(--text-main); font-size: 16px; }
        .unit-val { color: var(--accent-peach); font-size: 16px; }
        
        ul { margin: 5px 0 0 0; padding-left: 20px; font-size: 15px; color: var(--text-main); font-weight: 600;}
        li { margin-bottom: 8px; }

        @media (max-width: 1200px) {
            .app-wrapper { flex-direction: column; }
            .input-panel, .summary-panel { width: 100%; position: static; box-sizing: border-box; }
            .treatment-row { flex-wrap: wrap; align-items: flex-start; padding-bottom: 25px;}
            .drug-box, .time-group { width: 100%; }
            .time-group { flex-direction: row; gap: 15px; }
            .time-col input { width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="input-panel">
        <h2>Treatment Log</h2>
        
        <div class="global-settings">
            <label>Global Cut-Off:</label>
            <input type="date" id="cutOffDate" onchange="calculateAll()" title="Date of Service">
            <input type="text" id="cutOffTime" placeholder="HH:MM" maxlength="5" oninput="formatTime(this); calculateAll()" title="24-Hour Format (e.g., 1430)">
        </div>

        <div id="rowsContainer"></div>
        
        <div class="button-group">
            <button class="add-btn" onclick="addRow()">+ Add Admin</button>
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
    </div>

    <div class="summary-panel">
        <div class="summary-header-container">
            <h3>CPT Summary</h3>
            <button class="info-btn" onclick="toggleRationale()">Logic 📊</button>
        </div>
        
        <ul class="tally-list" id="tallyResult"><li class="cpt-item">--</li></ul>
    </div>
</div>

<div id="rationaleModal" class="floating-modal">
    <div class="modal-header" id="modalHeader">
        <h3>Logic Breakdown</h3>
        <button class="close-modal-btn" onclick="toggleRationale()">✕</button>
    </div>
    <div class="modal-body">
        <div class="result-line">Infusions:<span class="highlight" id="infusionResult">--</span></div>
        <div class="result-line">IV Pushes:<span class="highlight" id="injectionResult">--</span></div>
        <div class="result-line">Hydration:<span class="highlight" id="hydrationResult">--</span></div>
    </div>
</div>

<script>
    // --- DRAGGABLE MODAL LOGIC ---
    function toggleRationale() {
        const modal = document.getElementById('rationaleModal');
        modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
    }

    dragElement(document.getElementById("rationaleModal"));

    function dragElement(elmnt) {
        var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        if (document.getElementById("modalHeader")) {
            document.getElementById("modalHeader").onmousedown = dragMouseDown;
        } else {
            elmnt.onmousedown = dragMouseDown;
        }

        function dragMouseDown(e) {
            if(e.target.tagName === 'BUTTON') return;
            e = e || window.event;
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }

        function elementDrag(e) {
            e = e || window.event;
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
        }

        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }

    window.onload = function() {
        const savedData = localStorage.getItem('hiiCalculatorStateDOS');
        if (savedData) {
            const parsedData = JSON.parse(savedData);
            if (parsedData.global) {
                document.getElementById('cutOffDate').value = parsedData.global.cutOffDate || '';
                document.getElementById('cutOffTime').value = parsedData.global.cutOffTime || '';
            }
            if (parsedData.rows && parsedData.rows.length > 0) {
                parsedData.rows.forEach(item => addRow(item));
                calculateAll();
                return;
            }
        }
        addRow(); 
    };

    function clearAll() {
        if (confirm("Clear all treatments?")) {
            localStorage.removeItem('hiiCalculatorStateDOS');
            document.getElementById('rowsContainer').innerHTML = '';
            document.getElementById('cutOffDate').value = '';
            document.getElementById('cutOffTime').value = '';
            addRow();
            calculateAll();
        }
    }

    function formatTime(input) {
        let val = input.value.replace(/\D/g, ''); 
        if (val.length > 4) val = val.substring(0, 4); 
        if (val.length >= 2) {
            let hours = parseInt(val.substring(0, 2), 10);
            if (hours > 23) val = '23' + val.substring(2);
        }
        if (val.length >= 4) {
            let mins = parseInt(val.substring(2, 4), 10);
            if (mins > 59) val = val.substring(0, 2) + '59';
        }
        if (val.length >= 3) {
            input.value = val.substring(0, 2) + ':' + val.substring(2);
        } else {
            input.value = val;
        }
    }

    function addRow(data = null) {
        const container = document.getElementById('rowsContainer');
        const rowId = 'row_' + Date.now();
        
        let defaultDos = '';
        if (!data) {
            const existingDates = document.querySelectorAll('.dos-date');
            if (existingDates.length > 0) {
                defaultDos = existingDates[existingDates.length - 1].value;
            } else {
                const today = new Date();
                const offset = today.getTimezoneOffset() * 60000;
                defaultDos = (new Date(today - offset)).toISOString().split('T')[0];
            }
        }

        const dosVal = data ? data.dos : defaultDos;
        const typeVal = data ? data.type : 'infusion';
        const drugVal = data ? data.drug : '';
        const startVal = data ? data.start : '';
        const stopVal = data ? data.stop : '';

        const rowHTML = `
            <div class="treatment-row" id="${rowId}">
                <div class="drug-box">
                    <label>Type</label>
                    <select class="type-select" onchange="calculateAll()">
                        <option value="infusion" ${typeVal === 'infusion' ? 'selected' : ''}>Infusion</option>
                        <option value="hydration" ${typeVal === 'hydration' ? 'selected' : ''}>Hydration</option>
                        <option value="injection" ${typeVal === 'injection' ? 'selected' : ''}>IV Push</option>
                    </select>
                </div>
                <div class="drug-box">
                    <label>Drug Name</label>
                    <input type="text" class="drug-name" placeholder="Name" value="${drugVal}" oninput="calculateAll()">
                </div>
                <div class="drug-box">
                    <label>DOS</label>
                    <input type="date" class="dos-date" value="${dosVal}" onchange="calculateAll()">
                </div>
                <div class="time-group">
                    <div class="time-col">
                        <label>Start</label>
                        <input type="text" class="start-time" value="${startVal}" placeholder="HH:MM" maxlength="5" oninput="formatTime(this); calculateAll()">
                    </div>
                    <div class="time-col">
                        <label>End</label>
                        <input type="text" class="stop-time" value="${stopVal}" placeholder="HH:MM" maxlength="5" oninput="formatTime(this); calculateAll()">
                    </div>
                </div>
                <button class="remove-btn" onclick="removeRow('${rowId}')">✕</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    function removeRow(rowId) {
        document.getElementById(rowId).remove();
        calculateAll();
    }

    function getAbsoluteMinutes(dateStr, timeStr) {
        if (!dateStr || !timeStr || timeStr.length !== 5) return null;
        let timeMins = new Date(`${dateStr}T${timeStr}`).getTime();
        if (isNaN(timeMins)) return null; 
        return Math.floor(timeMins / 60000);
    }
    
    function getDisplayTime(mins) {
        let d = new Date(mins * 60000);
        let h = d.getHours().toString().padStart(2, '0');
        let m = d.getMinutes().toString().padStart(2, '0');
        return `${h}:${m}`;
    }

    function checkOverlap(start1, stop1, start2, stop2) {
        return Math.max(0, Math.min(stop1, stop2) - Math.max(start1, start2)) > 0;
    }

    function calculateAll() {
        const rows = document.querySelectorAll('.treatment-row');
        let treatments = [];
        let rowsToSave = []; 
        
        const cutOffDateStr = document.getElementById('cutOffDate').value;
        const cutOffTimeStr = document.getElementById('cutOffTime').value;
        let globalCutOffMins = null;
        if (cutOffDateStr && cutOffTimeStr && cutOffTimeStr.length === 5) {
            globalCutOffMins = getAbsoluteMinutes(cutOffDateStr, cutOffTimeStr);
        }

        let finalTallies = {}; 
        function addTally(dos, code, count) {
            if (count > 0 && dos) {
                if (!finalTallies[dos]) finalTallies[dos] = {};
                finalTallies[dos][code] = (finalTallies[dos][code] || 0) + count;
            }
        }

        rows.forEach(row => {
            let type = row.querySelector('.type-select').value;
            const drugInput = row.querySelector('.drug-name');
            let drug = drugInput.value.trim();
            const dosStr = row.querySelector('.dos-date').value;
            const startStr = row.querySelector('.start-time').value;
            let stopStr = row.querySelector('.stop-time').value;

            rowsToSave.push({ dos: dosStr, type: type, drug: drugInput.value, start: startStr, stop: stopStr });

            if (!drug && startStr.length === 5) {
                drugInput.style.boxShadow = "inset 4px 4px 8px rgba(255, 180, 138, 0.4), inset -4px -4px 8px var(--shadow-light)";
                drugInput.style.color = "var(--accent-peach)";
                drug = "unnamed"; 
            } else {
                drugInput.style.boxShadow = "inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light)";
                drugInput.style.color = "var(--text-main)";
            }

            if (dosStr && startStr.length === 5) {
                let start = getAbsoluteMinutes(dosStr, startStr);
                let stop = null;

                if (type === 'injection') {
                    stop = start;
                } else {
                    if (stopStr && stopStr.length === 5) {
                        stop = getAbsoluteMinutes(dosStr, stopStr);
                        if (stop < start) stop += (24 * 60); 
                    } 
                    if ((!stopStr || stopStr.length < 5) && globalCutOffMins) {
                        stop = globalCutOffMins;
                    }
                }

                if (globalCutOffMins && start !== null) {
                    if (start > globalCutOffMins) return; 
                    if (stop !== null && stop > globalCutOffMins) {
                        stop = globalCutOffMins; 
                    }
                }

                if (start !== null && stop !== null) {
                    let duration = stop - start;
                    if (type === 'infusion' && duration < 16) {
                        type = 'injection';
                        drug += " (short)";
                    }
                    treatments.push({ type, drug, start, stop, duration, dos: dosStr });
                }
            }
        });

        localStorage.setItem('hiiCalculatorStateDOS', JSON.stringify({
            global: { cutOffDate: cutOffDateStr, cutOffTime: cutOffTimeStr },
            rows: rowsToSave
        }));

        let infusions = treatments.filter(t => t.type === 'infusion');
        let hydrations = treatments.filter(t => t.type === 'hydration');
        let injections = treatments.filter(t => t.type === 'injection');

        // --- GLOBAL INITIAL LOGIC ---
        let hasGlobalInitial = false; 
        let activeTimeline = []; 
        let concurrentBilled = false; 

        let drugGroups = {};
        infusions.forEach(inf => {
            if (!drugGroups[inf.drug]) {
                drugGroups[inf.drug] = { totalTime: 0, blocks: [], earliestStart: inf.start, dos: inf.dos };
            }
            drugGroups[inf.drug].totalTime += inf.duration;
            drugGroups[inf.drug].blocks.push(inf);
            
            if (inf.start < drugGroups[inf.drug].earliestStart) {
                drugGroups[inf.drug].earliestStart = inf.start;
                drugGroups[inf.drug].dos = inf.dos; 
            }
        });

        let infCodes = [];
        let initialInfusionDrug = null;
        let globalEarliestInfStart = Infinity;

        for (let drug in drugGroups) {
            if (drugGroups[drug].totalTime >= 16) {
                if (drugGroups[drug].earliestStart < globalEarliestInfStart) {
                    globalEarliestInfStart = drugGroups[drug].earliestStart;
                    initialInfusionDrug = drug;
                }
            }
        }

        if (initialInfusionDrug) {
            hasGlobalInitial = true;
            let grp = drugGroups[initialInfusionDrug];
            
            infCodes.push(`96365: Initial admin of ${initialInfusionDrug} (${grp.totalTime}m)`);
            addTally(grp.dos, '96365', 1);
            
            let extraHours = Math.floor((grp.totalTime - 31) / 60);
            if (extraHours > 0) {
                infCodes.push(`96366 x ${extraHours}: Addt. hour(s) of ${initialInfusionDrug}`);
                addTally(grp.dos, '96366', extraHours);
            }
            
            activeTimeline = activeTimeline.concat(grp.blocks);
            delete drugGroups[initialInfusionDrug];
        }

        let remainingDrugs = [];
        for (let drug in drugGroups) {
            remainingDrugs.push({
                drug: drug,
                blocks: drugGroups[drug].blocks,
                totalTime: drugGroups[drug].totalTime,
                dos: drugGroups[drug].dos,
                earliestStart: drugGroups[drug].earliestStart
            });
        }
        remainingDrugs.sort((a, b) => a.earliestStart - b.earliestStart);

        remainingDrugs.forEach(grp => {
            let isConcurrent = false;
            let concurrentWithDrug = "";
            
            grp.blocks.forEach(b1 => {
                activeTimeline.forEach(b2 => {
                    if (checkOverlap(b1.start, b1.stop, b2.start, b2.stop)) {
                        isConcurrent = true;
                        concurrentWithDrug = b2.drug;
                    }
                });
            });

            if (isConcurrent) {
                if (!concurrentBilled) {
                    infCodes.push(`96368: ${grp.drug} concurrent w/ ${concurrentWithDrug} (${grp.totalTime}m)`);
                    addTally(grp.dos, '96368', 1);
                    concurrentBilled = true; 
                } else {
                    infCodes.push(`[N/A]: ${grp.drug} concurrent w/ ${concurrentWithDrug} (Max one 96368)`);
                }
            } else {
                infCodes.push(`96367: Seq. admin of ${grp.drug} (${grp.totalTime}m)`);
                addTally(grp.dos, '96367', 1);
                
                let extraHours = Math.floor((grp.totalTime - 31) / 60);
                if (extraHours > 0) {
                    infCodes.push(`96366 x ${extraHours}: Addt. hour(s) of ${grp.drug}`);
                    addTally(grp.dos, '96366', extraHours);
                }
            }
            activeTimeline = activeTimeline.concat(grp.blocks);
        });

        // --- INJECTIONS ---
        let injCodes = [];
        let injDrugGroups = {};
        injections.forEach(inj => {
            if (!injDrugGroups[inj.drug]) injDrugGroups[inj.drug] = [];
            injDrugGroups[inj.drug].push(inj);
        });

        let globalEarliestInjBlock = null;
        if (!hasGlobalInitial) {
            let globalEarliestInjStart = Infinity;
            for (let drug in injDrugGroups) {
                injDrugGroups[drug].forEach(b => {
                    if (b.start < globalEarliestInjStart) {
                        globalEarliestInjStart = b.start;
                        globalEarliestInjBlock = b;
                    }
                });
            }
        }

        for (let drug in injDrugGroups) {
            let blocks = injDrugGroups[drug];
            blocks.sort((a, b) => a.start - b.start); 

            let lastBilledTime = null;

            for (let i = 0; i < blocks.length; i++) {
                let b = blocks[i];
                
                if (!hasGlobalInitial && b === globalEarliestInjBlock) {
                    injCodes.push(`96374: Initial IVP of ${drug} @ ${getDisplayTime(b.start)}`);
                    addTally(b.dos, '96374', 1);
                    hasGlobalInitial = true;
                    lastBilledTime = b.start;
                } else if (i === 0) {
                    injCodes.push(`96375: Seq. IVP of ${drug} @ ${getDisplayTime(b.start)}`);
                    addTally(b.dos, '96375', 1);
                    lastBilledTime = b.start;
                } else {
                    let gap = b.start - lastBilledTime;
                    if (gap >= 31) {
                        injCodes.push(`96376: Seq. same drug IVP of ${drug} @ ${getDisplayTime(b.start)}`);
                        addTally(b.dos, '96376', 1);
                        lastBilledTime = b.start; 
                    } else {
                        let curT = getDisplayTime(b.start);
                        let prevT = getDisplayTime(lastBilledTime);
                        injCodes.push(`[N/A]: IVP of ${drug} @ ${curT} (No 31m gap from ${prevT})`);
                    }
                }
            }
        }

        // --- HYDRATION ---
        let hydCodes = [];
        let grossHydTime = hydrations.reduce((sum, h) => sum + h.duration, 0);
        let primaryHydDos = hydrations.length > 0 ? hydrations[0].dos : null;
        let infusionMinutes = new Set();
        
        activeTimeline.forEach(block => {
            for (let m = block.start; m < block.stop; m++) infusionMinutes.add(m);
        });

        let netHydrationMinutes = 0;
        let countedHydrationMinutes = new Set(); 

        hydrations.forEach(hyd => {
            for (let m = hyd.start; m < hyd.stop; m++) {
                if (!infusionMinutes.has(m) && !countedHydrationMinutes.has(m)) {
                    countedHydrationMinutes.add(m);
                    netHydrationMinutes++;
                }
            }
        });

        if (netHydrationMinutes >= 31) {
            if (hasGlobalInitial) {
                hydCodes.push(`96361: Seq. hydration (Net: ${netHydrationMinutes}m)`);
                addTally(primaryHydDos, '96361', 1);
            } else {
                hydCodes.push(`96360: Initial hydration (Net: ${netHydrationMinutes}m)`);
                addTally(primaryHydDos, '96360', 1);
                hasGlobalInitial = true;
            }
            
            let extraHydHours = Math.floor((netHydrationMinutes - 31) / 60);
            if (extraHydHours > 0) {
                hydCodes.push(`96361 x ${extraHydHours}: Addt. hydration hour(s)`);
                addTally(primaryHydDos, '96361', extraHydHours);
            }
        } else if (grossHydTime > 0) {
            hydCodes.push(`[N/A]: Net hydration time (${netHydrationMinutes}m) < 31m`);
        }

        const renderList = (arr) => arr.length > 0 ? "<ul><li>" + arr.join("</li><li>") + "</li></ul>" : "<ul><li>--</li></ul>";
        document.getElementById('infusionResult').innerHTML = renderList(infCodes);
        document.getElementById('injectionResult').innerHTML = renderList(injCodes);
        document.getElementById('hydrationResult').innerHTML = renderList(hydCodes);

        let tallyHTML = "";
        let sortedDates = Object.keys(finalTallies).sort();
        
        const cptHierarchy = ['96365', '96366', '96367', '96368', '96374', '96375', '96376', '96360', '96361'];

        if (sortedDates.length === 0) {
            tallyHTML = "<li class='cpt-item'>--</li>";
        } else {
            sortedDates.forEach(dos => {
                let displayDate = dos;
                if (dos && dos.includes('-')) {
                    let [y, m, d] = dos.split('-');
                    displayDate = `${m}/${d}/${y}`;
                }

                tallyHTML += `<li class="dos-group-header">DOS: ${displayDate}</li>`;

                let codesOnDate = finalTallies[dos];
                
                let sortedCodes = Object.keys(codesOnDate).sort((a, b) => {
                    let indexA = cptHierarchy.indexOf(a);
                    let indexB = cptHierarchy.indexOf(b);
                    if (indexA === -1) indexA = 999; 
                    if (indexB === -1) indexB = 999;
                    return indexA - indexB;
                });
                
                sortedCodes.forEach(code => {
                    let units = codesOnDate[code];
                    tallyHTML += `<li class="cpt-item">
                        <span class="cpt-val">${code}</span>
                        <span class="unit-val">x ${units}</span>
                    </li>`;
                });
            });
        }
        document.getElementById('tallyResult').innerHTML = tallyHTML;
    }
</script>

</html>
