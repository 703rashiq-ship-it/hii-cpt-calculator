<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HII CPT Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --lcd-bg: #E5D375;
            --lcd-ink: #111111;
        }

        /* Phone body casing */
        body { 
            font-family: Arial, sans-serif; 
            background-color: #1a1e24; 
            color: var(--lcd-ink); 
            margin: 0; 
            padding: 20px; 
        }
        
        .app-wrapper { 
            display: flex; 
            gap: 20px; 
            max-width: 1400px; 
            margin: 0 auto; 
            align-items: flex-start; 
        }
        
        /* Nokia Screen Panels */
        .input-panel, .detail-panel, .summary-panel { 
            background-color: var(--lcd-bg); 
            padding: 20px; 
            border-radius: 12px; 
            border: 4px solid #000; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.5); 
        }
        .input-panel { flex: 2.1; }
        .detail-panel { flex: 1.4; position: sticky; top: 20px; }
        .summary-panel { flex: 1.1; position: sticky; top: 20px; }
        
        /* Pixelated Headers */
        h2, h3 { 
            font-family: 'VT323', monospace;
            font-size: 32px;
            margin-top: 0; 
            color: var(--lcd-ink); 
            text-transform: uppercase; 
            letter-spacing: 2px;
            text-align: center;
            border-bottom: 2px solid var(--lcd-ink);
            padding-bottom: 10px;
        }
        
        .global-settings { 
            background-color: transparent; 
            padding: 10px 0; 
            margin-bottom: 20px; 
            border-bottom: 2px dashed var(--lcd-ink); 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            flex-wrap: wrap;
        }
        .global-settings label { 
            font-weight: bold; 
            color: var(--lcd-ink); 
            font-size: 14px; 
        }
        
        .button-group { 
            margin-top: 20px; 
            display: flex; 
            gap: 10px; 
            justify-content: space-between;
            border-top: 2px solid var(--lcd-ink);
            padding-top: 15px;
        }
        
        /* Styled Soft-Key Buttons */
        .add-btn, .clear-btn { 
            background-color: var(--lcd-ink); 
            color: var(--lcd-bg); 
            border: 2px solid var(--lcd-ink); 
            padding: 10px 15px; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.1s;
        }
        .add-btn {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 10% 100%);
            padding-left: 20px;
        }
        .clear-btn {
            clip-path: polygon(0 0, 100% 0, 90% 100%, 0% 100%);
            padding-right: 20px;
        }
        .add-btn:active, .clear-btn:active { 
            background-color: transparent; 
            color: var(--lcd-ink);
        }
        
        .treatment-row { 
            display: flex; 
            gap: 12px; 
            background: transparent; 
            border: 1px dotted var(--lcd-ink); 
            padding: 10px; 
            margin-bottom: 10px; 
            align-items: flex-end;
        }
        
        /* Retro Inputs */
        select, input { 
            padding: 6px; 
            border: 1px solid var(--lcd-ink); 
            background-color: transparent; 
            color: var(--lcd-ink); 
            font-family: 'VT323', monospace;
            font-size: 20px;
            box-sizing: border-box; 
        } 
        select:focus, input:focus { 
            outline: none; 
            background-color: var(--lcd-ink);
            color: var(--lcd-bg);
        }
        input::placeholder { color: rgba(17, 17, 17, 0.5); }
        
        /* Makes the date picker calendar icon black */
        input[type="date"]::-webkit-calendar-picker-indicator { 
            filter: invert(0); 
            cursor: pointer;
        }
        
        .drug-box { flex: 1; min-width: 120px; display: flex; flex-direction: column; }
        .drug-box label, .time-col label { 
            font-size: 12px; 
            margin-bottom: 4px; 
            color: var(--lcd-ink); 
            font-weight: bold; 
        }
        .drug-name { width: 100%; }

        .time-group { 
            display: flex; 
            gap: 8px; 
            background-color: transparent; 
            padding: 0; 
            border: none; 
        }
        .time-col { display: flex; flex-direction: column; }
        .time-col input { width: 70px; text-align: center; }
        
        .remove-btn { 
            background-color: transparent; 
            color: var(--lcd-ink); 
            border: 2px solid var(--lcd-ink); 
            cursor: pointer; 
            font-weight: bold; 
            height: 38px; 
            margin-bottom: 1px; 
        }
        .remove-btn:hover { 
            background-color: var(--lcd-ink); 
            color: var(--lcd-bg); 
        }
        
        /* Output Results */
        .result-line { 
            margin-bottom: 15px; 
            font-size: 14px; 
            font-weight: bold;
            border-bottom: 1px dotted var(--lcd-ink); 
            padding-bottom: 10px; 
            color: var(--lcd-ink);
        }
        .highlight { 
            font-family: 'VT323', monospace;
            font-size: 22px; 
            color: var(--lcd-ink); 
            display: block; 
            margin-top: 5px; 
            line-height: 1.1;
        }
        
        .tally-list { 
            font-size: 24px; 
            font-family: 'VT323', monospace; 
            color: var(--lcd-ink); 
            list-style: none; 
            padding: 0; 
            margin: 10px 0;
        }
        .tally-list li { 
            margin-bottom: 8px; 
            padding: 5px 0; 
            background: transparent; 
            border-bottom: 1px dashed var(--lcd-ink); 
            display: flex; 
            justify-content: space-between; 
        }
        
        ul { margin: 5px 0 0 0; padding-left: 20px; font-size: 20px; color: var(--lcd-ink);}
        li { margin-bottom: 6px; }

        @media (max-width: 1200px) {
            .app-wrapper { flex-direction: column; }
            .input-panel, .detail-panel, .summary-panel { width: 100%; position: static; box-sizing: border-box; }
            .treatment-row { flex-wrap: wrap; align-items: flex-start; }
            .drug-box, .time-group { width: 100%; }
            .time-group { flex-direction: column; gap: 10px; }
            .time-col input { width: 100%; }
        }
        /* Force crisp, pixelated rendering for the retro aesthetic */
* {
    -webkit-font-smoothing: none; /* Targets Chrome, Edge, Safari */
    -moz-osx-font-smoothing: grayscale; /* Targets Firefox */
    text-rendering: crispEdges; /* Tells the browser to prioritize sharp edges */
}
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="input-panel">
        <h2>Treatment Log</h2>
        
        <div class="global-settings">
            <label>Global Cut-Off:</label>
            <input type="date" id="cutOffDate" onchange="calculateAll()" title="Date of Service">
            <input type="text" id="cutOffTime" placeholder="HH:MM" maxlength="5" oninput="formatTime(this); calculateAll()" title="24-Hour Format (e.g., 1430)">
        </div>

        <div id="rowsContainer"></div>
        
        <div class="button-group">
            <button class="add-btn" onclick="addRow()">+ Add Admin</button>
            <button class="clear-btn" onclick="clearAll()">Clear All</button>
        </div>
    </div>

    <div class="detail-panel">
        <h3>Description</h3>
        <div class="result-line">Infusions:<span class="highlight" id="infusionResult">--</span></div>
        <div class="result-line">IV Pushes:<span class="highlight" id="injectionResult">--</span></div>
        <div class="result-line">Hydration:<span class="highlight" id="hydrationResult">--</span></div>
    </div>

    <div class="summary-panel">
        <h3>CPT Summary</h3>
        <ul class="tally-list" id="tallyResult"><li>--</li></ul>
    </div>
</div>

<script>
    window.onload = function() {
        const savedData = localStorage.getItem('hiiCalculatorStateDOS');
        if (savedData) {
            const parsedData = JSON.parse(savedData);
            if (parsedData.global) {
                document.getElementById('cutOffDate').value = parsedData.global.cutOffDate || '';
                document.getElementById('cutOffTime').value = parsedData.global.cutOffTime || '';
            }
            if (parsedData.rows && parsedData.rows.length > 0) {
                parsedData.rows.forEach(item => addRow(item));
                calculateAll();
                return;
            }
        }
        addRow(); 
    };

    function clearAll() {
        if (confirm("Format system memory? All treatments will be erased.")) {
            localStorage.removeItem('hiiCalculatorStateDOS');
            document.getElementById('rowsContainer').innerHTML = '';
            document.getElementById('cutOffDate').value = '';
            document.getElementById('cutOffTime').value = '';
            addRow();
            calculateAll();
        }
    }

    function formatTime(input) {
        let val = input.value.replace(/\D/g, ''); 
        if (val.length > 4) val = val.substring(0, 4); 
        if (val.length >= 2) {
            let hours = parseInt(val.substring(0, 2), 10);
            if (hours > 23) val = '23' + val.substring(2);
        }
        if (val.length >= 4) {
            let mins = parseInt(val.substring(2, 4), 10);
            if (mins > 59) val = val.substring(0, 2) + '59';
        }
        if (val.length >= 3) {
            input.value = val.substring(0, 2) + ':' + val.substring(2);
        } else {
            input.value = val;
        }
    }

    function addRow(data = null) {
        const container = document.getElementById('rowsContainer');
        const rowId = 'row_' + Date.now();
        
        let defaultDos = '';
        if (!data) {
            const existingDates = document.querySelectorAll('.dos-date');
            if (existingDates.length > 0) {
                defaultDos = existingDates[existingDates.length - 1].value;
            } else {
                const today = new Date();
                const offset = today.getTimezoneOffset() * 60000;
                defaultDos = (new Date(today - offset)).toISOString().split('T')[0];
            }
        }

        const dosVal = data ? data.dos : defaultDos;
        const typeVal = data ? data.type : 'infusion';
        const drugVal = data ? data.drug : '';
        const startVal = data ? data.start : '';
        const stopVal = data ? data.stop : '';

        const rowHTML = `
            <div class="treatment-row" id="${rowId}">
                <div class="drug-box">
                    <label>Type</label>
                    <select class="type-select" onchange="calculateAll()">
                        <option value="infusion" ${typeVal === 'infusion' ? 'selected' : ''}>Infusion</option>
                        <option value="hydration" ${typeVal === 'hydration' ? 'selected' : ''}>Hydration</option>
                        <option value="injection" ${typeVal === 'injection' ? 'selected' : ''}>IV Push</option>
                    </select>
                </div>
                <div class="drug-box">
                    <label>Drug Name</label>
                    <input type="text" class="drug-name" placeholder="Name" value="${drugVal}" oninput="calculateAll()">
                </div>
                <div class="drug-box">
                    <label>DOS</label>
                    <input type="date" class="dos-date" value="${dosVal}" onchange="calculateAll()">
                </div>
                <div class="time-group">
                    <div class="time-col">
                        <label>Start</label>
                        <input type="text" class="start-time" value="${startVal}" placeholder="HH:MM" maxlength="5" oninput="formatTime(this); calculateAll()">
                    </div>
                    <div class="time-col">
                        <label>End</label>
                        <input type="text" class="stop-time" value="${stopVal}" placeholder="HH:MM" maxlength="5" oninput="formatTime(this); calculateAll()">
                    </div>
                </div>
                <button class="remove-btn" onclick="removeRow('${rowId}')">X</button>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', rowHTML);
    }

    function removeRow(rowId) {
        document.getElementById(rowId).remove();
        calculateAll();
    }

    function getAbsoluteMinutes(dateStr, timeStr) {
        if (!dateStr || !timeStr || timeStr.length !== 5) return null;
        let timeMins = new Date(`${dateStr}T${timeStr}`).getTime();
        if (isNaN(timeMins)) return null; 
        return Math.floor(timeMins / 60000);
    }
    
    function getDisplayTime(mins) {
        let d = new Date(mins * 60000);
        let h = d.getHours().toString().padStart(2, '0');
        let m = d.getMinutes().toString().padStart(2, '0');
        return `${h}:${m}`;
    }

    function checkOverlap(start1, stop1, start2, stop2) {
        return Math.max(0, Math.min(stop1, stop2) - Math.max(start1, start2)) > 0;
    }

    function calculateAll() {
        const rows = document.querySelectorAll('.treatment-row');
        let treatments = [];
        let rowsToSave = []; 
        
        const cutOffDateStr = document.getElementById('cutOffDate').value;
        const cutOffTimeStr = document.getElementById('cutOffTime').value;
        let globalCutOffMins = null;
        if (cutOffDateStr && cutOffTimeStr && cutOffTimeStr.length === 5) {
            globalCutOffMins = getAbsoluteMinutes(cutOffDateStr, cutOffTimeStr);
        }

        let finalTallies = {}; 
        function addTally(dos, code, count) {
            if (count > 0 && dos) {
                if (!finalTallies[dos]) finalTallies[dos] = {};
                finalTallies[dos][code] = (finalTallies[dos][code] || 0) + count;
            }
        }

        rows.forEach(row => {
            let type = row.querySelector('.type-select').value;
            const drugInput = row.querySelector('.drug-name');
            let drug = drugInput.value.trim();
            const dosStr = row.querySelector('.dos-date').value;
            const startStr = row.querySelector('.start-time').value;
            let stopStr = row.querySelector('.stop-time').value;

            rowsToSave.push({ dos: dosStr, type: type, drug: drugInput.value, start: startStr, stop: stopStr });

            // Adjusted JS Validation colors for retro theme
            if (!drug && startStr.length === 5) {
                drugInput.style.border = "1px dashed var(--lcd-ink)";
                drugInput.style.backgroundColor = "var(--lcd-ink)";
                drugInput.style.color = "var(--lcd-bg)";
                drug = "unnamed"; 
            } else {
                drugInput.style.border = "1px solid var(--lcd-ink)";
                drugInput.style.backgroundColor = "transparent";
                drugInput.style.color = "var(--lcd-ink)";
            }

            if (dosStr && startStr.length === 5) {
                let start = getAbsoluteMinutes(dosStr, startStr);
                let stop = null;

                if (type === 'injection') {
                    stop = start;
                } else {
                    if (stopStr && stopStr.length === 5) {
                        stop = getAbsoluteMinutes(dosStr, stopStr);
                        if (stop < start) stop += (24 * 60); 
                    } 
                    if ((!stopStr || stopStr.length < 5) && globalCutOffMins) {
                        stop = globalCutOffMins;
                    }
                }

                if (globalCutOffMins && start !== null) {
                    if (start > globalCutOffMins) return; 
                    if (stop !== null && stop > globalCutOffMins) {
                        stop = globalCutOffMins; 
                    }
                }

                if (start !== null && stop !== null) {
                    let duration = stop - start;
                    if (type === 'infusion' && duration < 16) {
                        type = 'injection';
                        drug += " (short)";
                    }
                    treatments.push({ type, drug, start, stop, duration, dos: dosStr });
                }
            }
        });

        localStorage.setItem('hiiCalculatorStateDOS', JSON.stringify({
            global: { cutOffDate: cutOffDateStr, cutOffTime: cutOffTimeStr },
            rows: rowsToSave
        }));

        let infusions = treatments.filter(t => t.type === 'infusion');
        let hydrations = treatments.filter(t => t.type === 'hydration');
        let injections = treatments.filter(t => t.type === 'injection');

        // --- HIERARCHY 1: INFUSION LOGIC ---
        let infCodes = [];
        let initialInfusion = null;
        let concurrentBilled = false;
        let activeTimeline = []; 
        
        let drugGroups = {};
        infusions.forEach(inf => {
            if (!drugGroups[inf.drug]) drugGroups[inf.drug] = { totalTime: 0, blocks: [], dos: inf.dos };
            drugGroups[inf.drug].totalTime += inf.duration;
            drugGroups[inf.drug].blocks.push(inf);
        });

        for (let drug in drugGroups) {
            let primaryDos = drugGroups[drug].dos;
            if (drugGroups[drug].totalTime >= 16 && !initialInfusion) {
                initialInfusion = { drug: drug, blocks: drugGroups[drug].blocks };
                infCodes.push(`96365: Initial admin of ${drug} (${drugGroups[drug].totalTime}m)`);
                addTally(primaryDos, '96365', 1);
                
                let extraHours = Math.floor((drugGroups[drug].totalTime - 31) / 60);
                if (extraHours > 0) {
                    infCodes.push(`96366 x ${extraHours}: Addt. hour(s) of ${drug}`);
                    addTally(primaryDos, '96366', extraHours);
                }
                
                activeTimeline = activeTimeline.concat(drugGroups[drug].blocks);
                delete drugGroups[drug]; 
                break; 
            }
        }

        let remainingDrugs = [];
        for (let drug in drugGroups) {
            remainingDrugs.push({
                drug: drug,
                blocks: drugGroups[drug].blocks,
                totalTime: drugGroups[drug].totalTime,
                dos: drugGroups[drug].dos,
                earliestStart: Math.min(...drugGroups[drug].blocks.map(b => b.start))
            });
        }
        remainingDrugs.sort((a, b) => a.earliestStart - b.earliestStart);

        remainingDrugs.forEach(grp => {
            let isConcurrent = false;
            let concurrentWithDrug = "";
            
            grp.blocks.forEach(b1 => {
                activeTimeline.forEach(b2 => {
                    if (checkOverlap(b1.start, b1.stop, b2.start, b2.stop)) {
                        isConcurrent = true;
                        concurrentWithDrug = b2.drug;
                    }
                });
            });

            if (isConcurrent) {
                if (!concurrentBilled) {
                    infCodes.push(`96368: ${grp.drug} concurrent w/ ${concurrentWithDrug} (${grp.totalTime}m)`);
                    addTally(grp.dos, '96368', 1);
                    concurrentBilled = true; 
                } else {
                    infCodes.push(`[N/A]: ${grp.drug} concurrent w/ ${concurrentWithDrug} (Max one 96368)`);
                }
            } else {
                infCodes.push(`96367: Seq. admin of ${grp.drug} (${grp.totalTime}m)`);
                addTally(grp.dos, '96367', 1);
                
                let extraHours = Math.floor((grp.totalTime - 31) / 60);
                if (extraHours > 0) {
                    infCodes.push(`96366 x ${extraHours}: Addt. hour(s) of ${grp.drug}`);
                    addTally(grp.dos, '96366', extraHours);
                }
            }
            activeTimeline = activeTimeline.concat(grp.blocks);
        });

        // --- HIERARCHY 2: INJECTION LOGIC ---
        let injCodes = [];
        let hasPrimaryPush = false;
        let firstPushAssigned = false;

        let injDrugGroups = {};
        injections.forEach(inj => {
            if (!injDrugGroups[inj.drug]) injDrugGroups[inj.drug] = [];
            injDrugGroups[inj.drug].push(inj);
        });

        for (let drug in injDrugGroups) {
            let blocks = injDrugGroups[drug];
            blocks.sort((a, b) => a.start - b.start); 

            if (!initialInfusion && !firstPushAssigned) {
                injCodes.push(`96374: Initial IVP of ${drug} @ ${getDisplayTime(blocks[0].start)}`);
                addTally(blocks[0].dos, '96374', 1);
                firstPushAssigned = true;
                hasPrimaryPush = true;
            } else {
                injCodes.push(`96375: Seq. IVP of ${drug} @ ${getDisplayTime(blocks[0].start)}`);
                addTally(blocks[0].dos, '96375', 1);
            }

            let lastBilledTime = blocks[0].start; 
            for (let i = 1; i < blocks.length; i++) {
                let gap = blocks[i].start - lastBilledTime;

                if (gap >= 31) {
                    injCodes.push(`96376: Seq. same drug IVP of ${drug} @ ${getDisplayTime(blocks[i].start)}`);
                    addTally(blocks[i].dos, '96376', 1);
                    lastBilledTime = blocks[i].start; 
                } else {
                    let curT = getDisplayTime(blocks[i].start);
                    let prevT = getDisplayTime(lastBilledTime);
                    injCodes.push(`[N/A]: IVP of ${drug} @ ${curT} (No 31m gap from ${prevT})`);
                }
            }
        }

        // --- HIERARCHY 3: HYDRATION LOGIC ---
        let hydCodes = [];
        let grossHydTime = hydrations.reduce((sum, h) => sum + h.duration, 0);
        let primaryHydDos = hydrations.length > 0 ? hydrations[0].dos : null;
        let infusionMinutes = new Set();
        
        activeTimeline.forEach(block => {
            for (let m = block.start; m < block.stop; m++) infusionMinutes.add(m);
        });

        let netHydrationMinutes = 0;
        let countedHydrationMinutes = new Set(); 

        hydrations.forEach(hyd => {
            for (let m = hyd.start; m < hyd.stop; m++) {
                if (!infusionMinutes.has(m) && !countedHydrationMinutes.has(m)) {
                    countedHydrationMinutes.add(m);
                    netHydrationMinutes++;
                }
            }
        });

        if (netHydrationMinutes >= 31) {
            if (initialInfusion || hasPrimaryPush) {
                hydCodes.push(`96361: Seq. hydration (Net: ${netHydrationMinutes}m)`);
                addTally(primaryHydDos, '96361', 1);
            } else {
                hydCodes.push(`96360: Initial hydration (Net: ${netHydrationMinutes}m)`);
                addTally(primaryHydDos, '96360', 1);
            }
            
            let extraHydHours = Math.floor((netHydrationMinutes - 31) / 60);
            if (extraHydHours > 0) {
                hydCodes.push(`96361 x ${extraHydHours}: Addt. hydration hour(s)`);
                addTally(primaryHydDos, '96361', extraHydHours);
            }
        } else if (grossHydTime > 0) {
            hydCodes.push(`[N/A]: Net hydration time (${netHydrationMinutes}m) < 31m`);
        }

        // --- RENDER OUTPUT ---
        const renderList = (arr) => arr.length > 0 ? "<ul><li>" + arr.join("</li><li>") + "</li></ul>" : "<ul><li>--</li></ul>";
        document.getElementById('infusionResult').innerHTML = renderList(infCodes);
        document.getElementById('injectionResult').innerHTML = renderList(injCodes);
        document.getElementById('hydrationResult').innerHTML = renderList(hydCodes);

        // --- RENDER DOS - CPT - UNITS SUMMARY ---
        let tallyHTML = "";
        let sortedDates = Object.keys(finalTallies).sort();
        
        const cptHierarchy = ['96365', '96366', '96367', '96368', '96374', '96375', '96376', '96360', '96361'];

        if (sortedDates.length === 0) {
            tallyHTML = "<li>--</li>";
        } else {
            sortedDates.forEach(dos => {
                let codesOnDate = finalTallies[dos];
                
                let sortedCodes = Object.keys(codesOnDate).sort((a, b) => {
                    let indexA = cptHierarchy.indexOf(a);
                    let indexB = cptHierarchy.indexOf(b);
                    if (indexA === -1) indexA = 999; 
                    if (indexB === -1) indexB = 999;
                    return indexA - indexB;
                });
                
                sortedCodes.forEach(code => {
                    let units = codesOnDate[code];
                    let unitText = units > 1 ? 'x' : 'x';
                    // Replaced "Unit" text with a simple "x[Number]" style fitting a small screen
                    tallyHTML += `<li><span>${code}</span> <span>${unitText}${units}</span></li>`;
                });
            });
        }
        document.getElementById('tallyResult').innerHTML = tallyHTML;
    }
    <div id="poke-follower"></div>

<style>
  #poke-follower {
    /* Keeps the figure positioned relative to the screen */
    position: fixed; 
    top: 0;
    left: 0;
    
    width: 60px;
    height: 60px;
    
    /* Replace this URL with your custom Pokémon figure */
    background-image: url('https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/25.png');
    background-size: contain;
    background-repeat: no-repeat;
    
    /* CRITICAL: Prevents the image from blocking clicks on your actual content */
    pointer-events: none; 
    
    /* Puts it in the background. Use a high number like 9999 if you want it floating over everything instead */
    z-index: -1; 
    
    /* Centers the image on the cursor */
    transform: translate(-50%, -50%);
    
    /* Hides the figure until the mouse starts moving */
    opacity: 0; 
    transition: opacity 0.3s ease;
  }
.poke-trail {
  position: fixed;
  top: 0;
  left: 0;
  width: 15px;
  height: 15px;
  background-color: #FFCB05; /* Pikachu Yellow - change this to match your character */
  border-radius: 50%; /* Makes them circles */
  
  /* CRITICAL: Prevents blocking clicks */
  pointer-events: none;
  
  /* Put them further back than the main figure */
  z-index: -2; 
  
  transform: translate(-50%, -50%);
  opacity: 0; /* Hidden initially */
}
/* Add this below your .poke-trail CSS */

.falling-particle {
  position: fixed;
  top: -50px; /* Starts just above the top edge of the screen */
  width: 12px;
  height: 12px;
  
  /* Styling it like a little spark. You could also use background-image here! */
  background-color: #FFCB05; 
  border-radius: 50%;
  box-shadow: 0 0 5px #FFCB05, 0 0 10px #FF9D00;
  
  /* CRITICAL: Keeps them in the background and unclickable */
  pointer-events: none;
  z-index: -3; /* Placed behind the cursor and the trail */
  
  /* The animation is driven by CSS keyframes defined below */
  animation-name: fall-down;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}

/* Defines the falling motion */
@keyframes fall-down {
  0% {
    transform: translateY(0) rotate(0deg);
  }
  100% {
    /* Falls slightly past the bottom of the screen */
    transform: translateY(110vh) rotate(360deg); 
  }
}
